<!DOCTYPE html>
<html lang="ar" dir="rtl" data-i18n-document-title="page.title.checkout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الدفع | أكاديمية الفايبر العراقية</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/checkout.css">
  <script src="js/i18n.js"></script>
  <script src="js/settings-manager.js"></script>
</head>
<body>
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo">
        <img class="logo__img" src="images/logo.png" alt="Iraqi Fiber Academy Logo" width="42" height="42" />
        <div class="logo__text">
          <span class="logo__text-main" data-i18n="logo.main">أكاديمية الفايبر العراقية</span>
          <span class="logo__text-sub">IRAQI FIBER ACADEMY</span>
        </div>
      </a>
      <div class="header__actions">
        <div class="auth-slot" data-auth-slot data-auth-variant="landing"></div>
        <a href="index.html#pricing" class="header__cta" data-i18n="nav.plans">الباقات</a>
      </div>
    </div>
  </header>

  <main class="checkout-page">
    <div class="container" id="checkoutRoot">
      <div class="checkout-loading" role="status" data-i18n="checkout.loading">جاري تحميل صفحة الدفع…</div>
    </div>
  </main>

  <div class="checkout-modal" id="checkoutSuccessModal" hidden aria-hidden="true">
    <div class="checkout-modal__backdrop" data-checkout-success-close></div>
    <div class="checkout-modal__dialog" role="alertdialog" aria-modal="true" aria-labelledby="checkoutSuccessTitle">
      <div class="checkout-modal__icon" aria-hidden="true">✓</div>
      <h2 class="checkout-modal__title" id="checkoutSuccessTitle" data-i18n="checkout.successTitle">تم استلام طلبك</h2>
      <p class="checkout-modal__message" id="checkoutSuccessMessage" data-i18n="checkout.successMessage">
        تم استلام طلبك بنجاح، وسيتم تفعيل الكورس فور مراجعة الوصل من الإدارة.
      </p>
      <button type="button" class="btn btn--primary" data-checkout-success-close data-i18n="checkout.ok">حسناً</button>
    </div>
  </div>

  <script src="js/env-access.js"></script>
  <script type="module" src="js/checkout.js"></script>
  <script type="module" src="js/auth-manager.js"></script>
</body>
</html>
